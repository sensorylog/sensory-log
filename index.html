<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="theme-color" content="#F3F4F0" />
<meta name="description" content="A calm, private sensory and energy log with pattern insights, personal history and optional AI reflection" />
<title>Sensory Log</title>
<link rel="stylesheet" href="./styles/design-tokens.css" />
<link rel="stylesheet" href="./styles/app-shell.css" />
<link rel="stylesheet" href="./styles/liquid-glass.css" />
<link rel="stylesheet" href="./styles/accessibility.css" />
<link rel="stylesheet" href="./styles/home.css" />
<link rel="stylesheet" href="./styles/patterns.css" />
<link rel="stylesheet" href="./styles/regulation.css" />
<link rel="stylesheet" href="./styles/checkin.css" />
<link rel="stylesheet" href="./styles/history.css" />
<link rel="stylesheet" href="./styles/manual.css" />
<link rel="stylesheet" href="./styles/reports.css" />
<link rel="stylesheet" href="./styles/ai-signal.css" />
<script type="module" src="./js/app-shell.js"></script>
<script type="module" src="./js/checkin.js"></script>
<script type="module" src="./js/home.js"></script>
<script type="module" src="./js/patterns.js"></script>
<script type="module" src="./js/regulation.js"></script>
<script type="module" src="./js/history.js"></script>
<script type="module" src="./js/manual.js"></script>
<script type="module" src="./js/reports.js"></script>
<script type="module" src="./js/ai-ui.js"></script>
<script type="module" src="./js/signal.js"></script>
<style>
  :root {
    --bg: #F3F4F0;
    --surface: #FFFFFF;
    --ink: #2A2F2A;
    --muted: #6A7268;
    --border: #D6DAD2;
    --teal: #4A6F63;
    --teal-soft: #E2EDE8;
    --clay: #A37A58;
    --clay-soft: #F1E8DF;
    --rust: #9A5A46;
    --rust-soft: #F2E5E0;
    --good: #5A7A4E;
    --good-soft: #E8F0E5;
    --sleep: #4E6E8E;
    --sleep-soft: #E4EAF0;
    --social: #7A5E85;
    --social-soft: #EEE6F0;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --radius: 14px;
  }

  [data-theme="dark"] {
    --bg: #1C1F1C;
    --surface: #272B27;
    --ink: #E8EBE6;
    --muted: #9AA399;
    --border: #3A403A;
    --teal: #7BA894;
    --teal-soft: #2A3A34;
    --clay: #C49A78;
    --clay-soft: #362D24;
    --rust: #D08A74;
    --rust-soft: #3A2E2A;
    --good: #8BB87A;
    --good-soft: #2A3528;
    --sleep: #8FB0D3;
    --sleep-soft: #262E38;
    --social: #B79BC2;
    --social-soft: #332B39;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    padding: 20px 16px calc(56px + var(--safe-bottom));
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    transition: background 0.2s, color 0.2s;
  }

  .wrap { max-width: 460px; margin: 0 auto; }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 8px;
  }

  h1 {
    font-size: 1.5rem;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.02em;
  }

  .header-btns { display: flex; gap: 8px; }

  .theme-btn {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 999px;
    width: 42px;
    height: 42px;
    font-size: 1.2rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .subtitle {
    font-size: 0.92rem;
    color: var(--muted);
    margin: 0 0 20px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 16px;
    margin-bottom: 18px;
  }

  .date-row {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 18px;
  }

  .date-row input[type="date"] {
    flex: 1;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 11px 12px;
    font-size: 1rem;
    font-family: inherit;
    background: var(--bg);
    color: var(--ink);
    -webkit-appearance: none;
  }

  .field { margin-bottom: 22px; }
  .field:last-of-type { margin-bottom: 6px; }

  .field-label {
    font-size: 0.88rem;
    font-weight: 600;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  .field-hint {
    font-weight: 400;
    color: var(--muted);
    font-size: 0.8rem;
  }

  .scale {
    display: flex;
    gap: 8px;
  }

  .scale button {
    flex: 1;
    height: 48px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: var(--bg);
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    transition: 0.12s;
  }

  .scale button.on-energy { background: var(--teal); border-color: var(--teal); color: #fff; }
  .scale button.on-overwhelm { background: var(--rust); border-color: var(--rust); color: #fff; }
  .scale button.on-recovery { background: var(--clay); border-color: var(--clay); color: #fff; }
  .scale button.on-sleep { background: var(--sleep); border-color: var(--sleep); color: #fff; }
  .scale button.on-social { background: var(--social); border-color: var(--social); color: #fff; }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .chip {
    border: 1.5px solid var(--border);
    background: var(--bg);
    color: var(--ink);
    border-radius: 999px;
    padding: 9px 14px;
    font-size: 0.88rem;
    font-family: inherit;
    cursor: pointer;
    transition: 0.12s;
  }

  .chip.active { border-color: var(--teal); background: var(--teal-soft); color: var(--teal); font-weight: 600; }
  .chip.active-good { border-color: var(--good); background: var(--good-soft); color: var(--good); font-weight: 600; }
  .chip.active-warn { border-color: var(--rust); background: var(--rust-soft); color: var(--rust); font-weight: 600; }
  .chip.small { padding: 6px 11px; font-size: 0.8rem; }

  .tag-add {
    display: flex;    gap: 8px;
    margin-top: 10px;
  }

  input[type="text"], input[type="number"], textarea {
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 1rem;
    font-family: inherit;
    background: var(--bg);
    color: var(--ink);
    width: 100%;
    -webkit-appearance: none;
  }

  input[type="text"] { flex: 1; }
  textarea { resize: vertical; min-height: 72px; }

  .sleep-hours-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .sleep-hours-row input[type="number"] { width: 90px; flex: none; }
  .sleep-hours-row span { font-size: 0.85rem; color: var(--muted); }

  .btn {
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    border-radius: 12px;
    padding: 11px 14px;
    font-size: 0.92rem;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
  }

  .btn.on { border-color: var(--teal); background: var(--teal-soft); color: var(--teal); font-weight: 600; }
  .btn.danger { border-color: var(--rust); color: var(--rust); }

  .btn-primary {
    width: 100%;
    background: var(--teal);
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 15px;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    margin-top: 6px;
  }

  .saved-msg { text-align: center; color: var(--teal); font-size: 0.95rem; font-weight: 600; margin-top: 12px; min-height: 1.3em; }
  .error { color: var(--rust); font-size: 0.9rem; text-align: center; margin: 8px 0 0; }

  h2 { font-size: 1.05rem; font-weight: 700; margin: 26px 0 12px; }
  h3 { font-size: 0.92rem; font-weight: 700; margin: 0 0 10px; }

  .empty-note { color: var(--muted); font-size: 0.92rem; }

  .window-row, .metric-row { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 12px; }

  .chart-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 14px 12px;
    margin-bottom: 14px;
  }

  .legend { display: flex; gap: 12px; font-size: 0.75rem; color: var(--muted); padding: 10px 2px 0; justify-content: center; flex-wrap: wrap; }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; vertical-align: middle; }

  .insight {
    background: var(--rust-soft);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    font-size: 0.92rem;
    line-height: 1.5;
    margin-bottom: 12px;
  }
  .insight.good { background: var(--good-soft); }
  .insight.neutral { background: var(--sleep-soft); }
  .insight strong { font-weight: 700; }

  .weekday-grid { display: flex; gap: 5px; align-items: flex-end; height: 90px; margin-top: 4px; }
  .weekday-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .weekday-bar { width: 70%; border-radius: 4px 4px 0 0; background: var(--teal); min-height: 3px; }
  .weekday-label { font-size: 0.62rem; color: var(--muted); margin-top: 4px; }

  .live-forecast { font-size: 0.85rem; color: var(--muted); margin-top: -10px; margin-bottom: 20px; line-height: 1.4; }
  .live-forecast strong { color: var(--ink); }

  details summary { cursor: pointer; font-size: 0.92rem; color: var(--muted); padding: 8px 0; list-style: none; }
  details summary::-webkit-details-marker { display: none; }

  .log-row { font-size: 0.82rem; line-height: 1.55; border-bottom: 1px solid var(--border); padding: 9px 0; }
  .outlier-tag { color: var(--rust); font-weight: 600; }

  .backup-card, .ai-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 16px;
    margin-top: 24px;
  }

  .backup-title, .ai-title { font-size: 0.98rem; font-weight: 700; margin-bottom: 4px; }
  .backup-desc, .ai-desc { font-size: 0.88rem; color: var(--muted); margin: 0 0 14px; line-height: 1.45; }

  .backup-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .backup-status { font-size: 0.88rem; color: var(--teal); margin-top: 10px; min-height: 1.2em; }
  .backup-status.err { color: var(--rust); }

  .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--muted); margin: 10px 0; }
  .checkbox-row input { width: 16px; height: 16px; }

  .ai-response {
    background: var(--sleep-soft);
    border-radius: 12px;
    padding: 14px 15px;
    font-size: 0.9rem;
    line-height: 1.55;
    margin-top: 12px;
    white-space: pre-wrap;
  }

  .ai-ask-row { display: flex; gap: 8px; margin-top: 14px; }

  .tip {
    background: var(--teal-soft);
    border-radius: 12px;
    padding: 13px 15px;
    font-size: 0.88rem;
    color: var(--teal);
    margin-bottom: 18px;
    line-height: 1.45;
  }

  #legacyEngine { display: none; }

  .footnote { font-size: 0.78rem; color: var(--muted); margin-top: 32px; line-height: 1.5; }

  button:focus-visible, textarea:focus, input:focus { outline: 2px solid var(--teal); outline-offset: 2px; }

  .section-divider { height: 1px; background: var(--border); margin: 8px 0 18px; }

  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--teal);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: -2px;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <header class="app-header">
    <div class="app-brand">
      <div class="app-brand-mark" aria-hidden="true">SL</div>
      <div class="app-brand-copy">
        <div class="app-brand-name">Sensory Log</div>
        <div class="app-brand-state">Notice · understand · regulate</div>
      </div>
    </div>
    <div class="header-btns">
      <button class="theme-btn" id="themeBtn" type="button" aria-label="Toggle dark mode">◐</button>
    </div>
  </header>

  <main class="app-shell" id="appShell">
    <section class="app-view" id="view-home"></section>
    <section class="app-view" id="view-checkin"></section>
    <section class="app-view" id="view-patterns"></section>
    <section class="app-view" id="view-regulation"></section>
    <section class="app-view app-more" id="view-more">
      <section class="app-more-hero">
        <div class="app-kicker">Your space</div>
        <h2>Everything you have learned about yourself.</h2>
        <p>History, your operating manual, reports and Signal live here. Nothing is a streak, and nothing needs to be opened every day.</p>
      </section>
      <div class="app-more-grid">
        <button class="app-more-card" type="button" data-route="history"><strong>History</strong><span>See days, dates and what you logged over time.</span></button>
        <button class="app-more-card" type="button" data-route="manual"><strong>My manual</strong><span>A living summary of what your own data suggests you need.</span></button>
        <button class="app-more-card" type="button" data-route="reports"><strong>Reports</strong><span>Quiet, evidence-based summaries you can print or save.</span></button>
        <button class="app-more-card" type="button" data-route="signal"><strong>Signal</strong><span>A small feed for useful context, with pause and hide controls.</span></button>
      </div>
      <section class="app-secondary">
        <div class="app-secondary-row">
          <div><strong>Take a break</strong><div class="app-brand-state">There is no streak to protect.</div></div>
          <button class="app-secondary-btn" type="button" data-route="regulate">Regulate</button>
        </div>
      </section>
    </section>
    <section class="app-view" id="view-history"></section>
    <section class="app-view" id="view-manual"></section>
    <section class="app-view" id="view-reports"></section>
    <section class="app-view" id="view-signal"></section>
  </main>

  <nav class="app-nav" aria-label="Primary">
    <button type="button" data-route="home"><span aria-hidden="true">⌂</span>Home</button>
    <button type="button" data-route="checkin"><span aria-hidden="true">＋</span>Check in</button>
    <button type="button" data-route="patterns"><span aria-hidden="true">◌</span>Patterns</button>
    <button type="button" data-route="regulate"><span aria-hidden="true">◒</span>Regulate</button>
    <button type="button" data-route="more"><span aria-hidden="true">•••</span>More</button>
  </nav>



</body>
</html>
