<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="theme-color" content="#F3F4F0" />
<meta name="description" content="A calm, private sensory and energy log with pattern insights, personal history and optional AI reflection" />
<title>Sensory Log</title>
<link rel="stylesheet" href="./styles/license.css" />
<!-- Foundation primitives -->
<link rel="stylesheet" href="./styles/design-tokens.css" />
<link rel="stylesheet" href="./styles/liquid-glass.css" />
<link rel="stylesheet" href="./styles/app-shell.css" />

<!-- Feature styles -->
<link rel="stylesheet" href="./styles/home.css" />
<link rel="stylesheet" href="./styles/patterns.css" />
<link rel="stylesheet" href="./styles/regulation.css" />
<link rel="stylesheet" href="./styles/checkin.css" />
<link rel="stylesheet" href="./styles/history.css" />
<link rel="stylesheet" href="./styles/manual.css" />
<link rel="stylesheet" href="./styles/reports.css" />
<link rel="stylesheet" href="./styles/ai-signal.css" />
<link rel="stylesheet" href="./styles/backup.css" />
<link rel="stylesheet" href="./styles/onboarding.css" />
<link rel="stylesheet" href="./styles/preferences.css" />
<link rel="stylesheet" href="./styles/privacy.css" />

<!-- Phase B canonical visual engine: intentionally last among feature CSS. -->
<link rel="stylesheet" href="./styles/visual-system.css" />
<link rel="stylesheet" href="./styles/accessibility.css" />
<link rel="manifest" href="./manifest.webmanifest" />
<script type="module" src="./js/app-shell.js"></script>
<script type="module" src="./js/checkin.js"></script>
<script type="module" src="./js/home.js"></script>
<script type="module" src="./js/patterns.js"></script>
<script type="module" src="./js/regulation.js"></script>
<script type="module" src="./js/history.js"></script>
<script type="module" src="./js/manual.js"></script>
<script type="module" src="./js/reports.js"></script>
<script type="module" src="./js/signal.js"></script>
<script type="module" src="./js/backup.js"></script>
<script type="module" src="./js/onboarding.js"></script>
<script type="module" src="./js/preferences.js"></script>
<script type="module" src="./js/privacy.js"></script>
</head>
<body>
<div class="wrap">
  <header class="app-header">
    <div class="app-brand">
      <div class="app-brand-mark" aria-hidden="true">SL</div>
      <div class="app-brand-copy">
        <div class="app-brand-name">Sensory Log</div>
        <div class="app-brand-state">Notice · understand · regulate</div>
      </div>
    </div>
    <div class="header-btns">
      <button class="theme-btn" id="themeBtn" type="button" aria-label="Toggle dark mode">◐</button>
    </div>
  </header>

  <main class="app-shell" id="appShell">
    <section class="app-view" id="view-home"></section>
    <section class="app-view" id="view-checkin"></section>
    <section class="app-view" id="view-patterns"></section>
    <section class="app-view" id="view-regulation"></section>
    <section class="app-view app-more" id="view-more">
      <section class="app-more-hero">
        <div class="app-kicker">Your space</div>
        <h2>Everything you have learned about yourself.</h2>
        <p>History, your operating manual, reports and Signal live here. Nothing is a streak, and nothing needs to be opened every day.</p>
      </section>
      <div class="app-more-grid">
        <button class="app-more-card" type="button" data-route="history"><strong>History</strong><span>See days, dates and what you logged over time.</span></button>
        <button class="app-more-card" type="button" data-route="manual"><strong>My manual</strong><span>A living summary of what your own data suggests you need.</span></button>
        <button class="app-more-card" type="button" data-route="reports"><strong>Reports</strong><span>Quiet, evidence-based summaries you can print or save.</span></button>
        <button class="app-more-card" type="button" data-route="signal"><strong>Signal</strong><span>A small feed for useful context, with pause and hide controls.</span></button>
        <button class="app-more-card" type="button" data-route="backup"><strong>Your data</strong><span>Export, import and keep a copy of the information you have logged.</span></button>
        <button class="app-more-card" type="button" data-route="privacy"><strong>Privacy</strong><span>See what stays local and manage your local data.</span></button>
        <button class="app-more-card" type="button" data-route="privacy"><strong>Privacy</strong><span>See what stays local and manage your local data.</span></button>
        <button class="app-more-card app-more-card-secondary" type="button" data-signal-restore><strong>Bring Signal back</strong><span>Restore the Signal feed if you previously hid it.</span></button>
      </div>
      <section id="slPreferences" class="sl-preferences"></section>
      <div class="app-info-links" aria-label="Information">
        <button type="button" class="app-info-link" data-route="about">About us</button>
        <button type="button" class="app-info-link" data-route="contact">Contact us</button>
        <button type="button" class="app-info-link" data-route="terms">Terms of Service</button>
      </div>
      <section class="app-secondary">
        <div class="app-secondary-row">
          <div><strong>Take a break</strong><div class="app-brand-state">There is no streak to protect.</div></div>
          <button class="app-secondary-btn" type="button" data-route="regulate">Regulate</button>
        </div>
      </section>
    </section>
    <section class="app-view" id="view-history"></section>
    <section class="app-view" id="view-manual"></section>
    <section class="app-view" id="view-reports"></section>
    <section class="app-view" id="view-signal"></section>
    <section class="app-view" id="view-backup"><section id="slBackup" class="sl-backup"></section></section>
    <section class="app-view" id="view-privacy"><section id="slPrivacy" class="sl-privacy"></section></section>
    <section class="app-view" id="view-about"></section>
    <section class="app-view" id="view-contact"></section>
    <section class="app-view" id="view-terms"></section>
  </main>

  <nav class="app-nav" aria-label="Primary">
    <button type="button" data-route="home"><span aria-hidden="true">⌂</span>Home</button>
    <button type="button" data-route="checkin"><span aria-hidden="true">＋</span>Check in</button>
    <button type="button" data-route="patterns"><span aria-hidden="true">◌</span>Patterns</button>
    <button type="button" data-route="regulate"><span aria-hidden="true">◒</span>Regulate</button>
    <button type="button" data-route="more"><span aria-hidden="true">•••</span>More</button>
  </nav>
</div>
</body>
</html>
