name: Validate Sensory Log

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-sensory-log-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Static integrity
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate application integrity
        run: node scripts/validate-app.mjs

      - name: Validate Phase A data contracts
        run: node scripts/test-foundation.mjs

      - name: Validate Phase C state engine
        run: node scripts/test-state-engine.mjs

      - name: Validate Phase D check-in contract
        run: node scripts/test-checkin.mjs

      - name: Validate Phase E pattern intelligence
        run: node scripts/test-pattern-engine.mjs

      - name: Validate Phase F regulation engine
        run: node scripts/test-regulation-engine.mjs

      - name: Validate Phase G personal manual engine
        run: node scripts/test-manual-engine.mjs

      - name: Validate Phase H Signal engine
        run: node scripts/test-signal-engine.mjs

      - name: Validate Phase I Ask Your Data engine
        run: node scripts/test-query-engine.mjs

      - name: Validate Phase J PWA assets
        run: node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('manifest.webmanifest','utf8')); if(m.display!=='standalone'||!m.scope||!fs.existsSync('sw.js')) process.exit(1); console.log('Phase J PWA assets valid.');"

      - name: Validate Phase K privacy contract\n        run: node scripts/test-privacy.mjs\n\n      - name: Validate Phase K access gate contract
        run: node scripts/test-access-gate.mjs

      - name: Validate JavaScript module syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done < <(find js -type f -name '*.js' -print0)
