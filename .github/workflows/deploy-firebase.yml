name: Deploy Sensory Log to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Write Firebase service-account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SENSORYLOG_3D630 }}
        run: |
          set -euo pipefail
          credentials="${RUNNER_TEMP}/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$credentials"
          test -s "$credentials"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$credentials" >> "$GITHUB_ENV"
          project_id="$(node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(!p.project_id) process.exit(1); process.stdout.write(p.project_id)' "$credentials")"
          echo "FIREBASE_PROJECT_ID=$project_id" >> "$GITHUB_ENV"

      - name: Deploy to Firebase Hosting
        run: |
          set -euo pipefail
          npm install --global firebase-tools@15.31.0
          echo "Deploying Firebase Hosting project: $FIREBASE_PROJECT_ID"
          firebase deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive
